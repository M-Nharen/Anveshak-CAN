name: CI

on:
  push:
  pull_request:

jobs:
  defs-and-sim:
    name: Definitions, codegen and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r defs/requirements.txt -r host/sim/requirements.txt ruff

      - name: Validate defs/rover.dbc and defs/errors.yaml
        run: python defs/codegen/check.py

      - name: Regenerate code and confirm it is committed
        run: |
          python defs/codegen/generate.py
          git diff --exit-code -- firmware/generated defs/generated

      - name: Lint Python sources
        run: ruff check defs/codegen host/sim host/tools

      - name: Run simulator tests
        run: pytest host/sim host/tools -v

  firmware:
    name: Firmware (core library, host-side unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build anveshak_can_core for Linux and run loopback-driver unit tests
        run: |
          cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

  bench-esp32-arduino:
    name: Bench node sketch (Arduino-ESP32 3.3, WROOM + S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check src/anv matches firmware/core and firmware/generated
        run: firmware/nodes/bench_esp32_arduino/sync_core.sh --check

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Compile for the ESP32 (WROOM) and the ESP32-S3
        run: |
          for fqbn in esp32:esp32:esp32 esp32:esp32:esp32s3; do
            arduino-cli compile --fqbn "$fqbn" --warnings all firmware/nodes/bench_esp32_arduino
          done

  # --- Later P0 siblings fill these in; left here so the pipeline shape is visible early. ---

  gateway:
    name: Gateway core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ iproute2 kmod

      - name: Build host/gateway (warnings are errors)
        run: |
          cmake -S host/gateway -B build-gateway -DCMAKE_BUILD_TYPE=Debug -DANV_WERROR=ON
          cmake --build build-gateway -j"$(nproc)"

      # The end-to-end test (real anv_can_gateway + Python simulator on vcan0) needs the vcan kernel
      # module. Hosted runners may not ship it; the test then reports itself as skipped.
      - name: Install simulator dependencies and vcan (best effort)
        run: |
          pip install -r defs/requirements.txt -r host/sim/requirements.txt
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan || true

      - name: Run gateway tests
        run: |
          ctest --test-dir build-gateway --output-on-failure 2>&1 | tee gateway-test.log
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      # Test output is hard to fetch from some tools; failing lines go into an annotation.
      - name: Summarise failure
        if: failure()
        run: |
          [ -f gateway-test.log ] && echo "::error title=gateway tests (${{ matrix.os }})::$(grep -E 'FAIL|CHECK|Failed|Timeout|\*\*\*' gateway-test.log | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 0
        shell: bash

  # The same sources must build and pass on both ROS 2 distributions (x86 containers).
  ros2:
    name: ROS 2 ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake python3-colcon-common-extensions python3-pytest \
            ros-${{ matrix.distro }}-rosidl-default-generators \
            ros-${{ matrix.distro }}-rosidl-default-runtime \
            ros-${{ matrix.distro }}-geometry-msgs \
            ros-${{ matrix.distro }}-diagnostic-msgs \
            ros-${{ matrix.distro }}-launch-testing \
            ros-${{ matrix.distro }}-launch-testing-ament-cmake \
            ros-${{ matrix.distro }}-launch-testing-ros

      - name: colcon build
        run: |
          . /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --base-paths host/ros2 --event-handlers console_cohesion+ 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      - name: colcon test
        run: |
          . /opt/ros/${{ matrix.distro }}/setup.bash
          . install/setup.bash
          colcon test --base-paths host/ros2 --event-handlers console_direct+ --return-code-on-test-failure 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          colcon test-result --verbose
        shell: bash

      # CI logs are hard to fetch from some tools; the tail of a failure goes into an annotation.
      - name: Summarise failure
        if: failure()
        run: |
          for f in build.log test.log; do
            [ -f "$f" ] && echo "::error title=ros2 ${{ matrix.distro }} $f::$(grep -iE 'error|fail|assert|Traceback|fatal|can_gateway_node-1' "$f" | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
          for f in log/latest_test/*/stdout_stderr.log; do
            [ -f "$f" ] && echo "::error title=ros2 ${{ matrix.distro }} $f::$(grep -iE 'error|fail|assert|Traceback|fatal|can_gateway_node-1' "$f" | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
          exit 0
        shell: bash

  dashboard:
    name: Dashboard (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend lint and tests (FastAPI)
        run: |
          pip install -r dashboard/backend/requirements.txt ruff
          ruff check dashboard/backend 2>&1 | tee backend.log
          test "${PIPESTATUS[0]}" -eq 0
          cd dashboard/backend
          pytest -q 2>&1 | tee ../../backend.log
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No lockfile is committed yet, so this installs the versions pinned in package.json.
      - name: Frontend build (Svelte + uPlot)
        run: |
          cd dashboard/frontend
          npm install --no-audit --no-fund 2>&1 | tee ../../frontend.log
          test "${PIPESTATUS[0]}" -eq 0
          npm run build 2>&1 | tee -a ../../frontend.log
          test "${PIPESTATUS[0]}" -eq 0
        shell: bash

      # The tail of a failure goes into an annotation, where it is easy to read.
      - name: Summarise failure
        if: failure()
        run: |
          for f in backend.log frontend.log; do
            [ -f "$f" ] && echo "::error title=dashboard $f::$(grep -iE 'error|fail|assert|Traceback|warn' "$f" | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
          exit 0
        shell: bash
