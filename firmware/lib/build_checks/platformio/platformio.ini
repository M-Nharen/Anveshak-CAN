; PlatformIO build of the isotp_echo example, using both libraries from their folders.
; Arduino-ESP32 3.3 (esp_twai) comes from the pioarduino platform; the official one is still on 2.x.
; CI: pio run -d firmware/lib/build_checks/platformio

[platformio]
src_dir = ../../anv_proto/examples/isotp_echo

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
lib_deps =
  symlink://../../anv_link
  symlink://../../anv_proto

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
