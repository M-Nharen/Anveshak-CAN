# can_gateway parameters for the Raspberry Pi host.
can_gateway:
  ros__parameters:
    bus: socketcan          # "fake" runs an in-process simulated rover (development, tests)
    interface_name: can0
    host_id: 2
    tie_break: 0            # 0 = use host_id
    auto_takeover: false    # a standby host never takes over by itself unless this is true
    rt_priority: 50
    cpu_affinity: 3      # pin the CAN threads to this core; -1 = no pinning

    # Skid-steer geometry for /cmd_vel. Measure these on the rover.
    wheel_radius: 0.15      # m
    track_width: 0.60       # m
    left_drives: [1, 2, 3]
    right_drives: [4, 5, 6]
    invert_left: false
    invert_right: false
    accel_limit: 10.0       # rad/s^2
    cmd_timeout_s: 0.5      # stop the wheels when no command arrived for this long
    status_rate_hz: 10.0

    debug_level: 0          # whole-rover default; also settable at runtime with "ros2 param set"
    flight_recorder: true
    flight_recorder_dir: ""   # e.g. /var/log/anveshak/flight; empty = memory only, no auto-save
    event_log_dir: ""         # e.g. /var/log/anveshak/events; empty = no JSONL log file

    # The gateway link to the Orin (see orin.yaml's link_peer_host for the other side).
    link_enabled: false
    link_listen_port: 7400
    link_peer_host: ""        # the Orin's address on the host-to-host network
    link_peer_port: 7400
