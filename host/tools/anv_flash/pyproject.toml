[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anv-flash"
version = "0.1.0"
description = "Reflash Anveshak rover nodes over CAN (ISO-TP bootloader on class 7)"
requires-python = ">=3.10"
dependencies = ["python-can>=4.3", "can-isotp>=2.0", "cantools>=39"]

[project.scripts]
anv-flash = "anv_flash.cli:main"

[tool.setuptools]
packages = ["anv_flash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
